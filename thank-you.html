<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thank you | ISBuildWeb</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f0e8;color:#191919;font-family:Inter,system-ui,sans-serif;padding:24px}.card{width:min(680px,100%);background:#fff;border:2px solid #191919;padding:52px;box-shadow:12px 12px 0 #ff5a2a}.mark{display:grid;place-items:center;width:52px;height:52px;background:#c8ff3d;border:2px solid #191919;font-weight:900;margin-bottom:28px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#ff5a2a}.card h1{font-family:Manrope,sans-serif;font-size:clamp(38px,7vw,64px);line-height:1;margin:14px 0 20px;letter-spacing:-2px}.card p{font-size:17px;line-height:1.7;color:#575757;max-width:560px}.btn{display:inline-flex;margin-top:22px;background:#191919;color:#fff;text-decoration:none;padding:15px 20px;font-weight:800;border:2px solid #191919}.btn:hover{background:#ff5a2a}@media(max-width:600px){.card{padding:34px 24px;box-shadow:7px 7px 0 #ff5a2a}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">IS</div>
    <span class="eyebrow">Enquiry received</span>
    <h1>Thanks — we’ll be in touch.</h1>
    <p>Your project enquiry has been submitted to ISBuildWeb. We’ll review what you sent and reply to the email address you provided.</p>
    <a class="btn" href="https://www.isbuildweb.com/">Back to ISBuildWeb</a>
  </main>
</body>
</html>
